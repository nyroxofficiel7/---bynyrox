<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Widget Horloge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .widget {
      background: #1f2937;
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      margin-bottom: 20px;
    }

    .time {
      font-size: 55px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .date {
      margin-top: 10px;
      font-size: 17px;
      opacity: .8;
    }

    .settings {
      background: #1f2937;
      padding: 20px;
      border-radius: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      margin-top: 15px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    input,
    select {
      background: #374151;
      color: white;
    }

    button {
      margin-top: 18px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .reset {
      background: #4b5563;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🕐 Mon Widget</h1>

    <!-- Widget -->
    <div class="widget">
      <div class="time" id="clock">12:00:00</div>
      <div class="date" id="date">Vendredi 4 septembre 2026</div>
    </div>

    <!-- Paramètres -->
    <div class="settings">

      <label for="timeInput">Modifier l'heure affichée</label>
      <input type="time" id="timeInput">

      <label for="format">Format</label>
      <select id="format">
        <option value="24">24 heures</option>
        <option value="12">12 heures</option>
      </select>

      <label for="color">Couleur de l'heure</label>
      <input type="color" id="color" value="#ffffff">

      <button onclick="applySettings()">
        Appliquer
      </button>

      <button class="reset" onclick="resetClock()">
        Réinitialiser
      </button>

    </div>

  </div>

  <script>
    let customTime = null;
    let useCustomTime = false;

    const clock = document.getElementById("clock");
    const dateElement = document.getElementById("date");
    const timeInput = document.getElementById("timeInput");
    const formatSelect = document.getElementById("format");
    const colorInput = document.getElementById("color");

    function updateClock() {
      let now = new Date();

      if (useCustomTime && customTime) {
        now.setHours(customTime.hours);
        now.setMinutes(customTime.minutes);
        now.setSeconds(customTime.seconds);

        customTime.seconds++;

        if (customTime.seconds >= 60) {
          customTime.seconds = 0;
          customTime.minutes++;

          if (customTime.minutes >= 60) {
            customTime.minutes = 0;
            customTime.hours++;

            if (customTime.hours >= 24) {
              customTime.hours = 0;
            }
          }
        }
      }

      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      if (formatSelect.value === "12") {
        const period = hours >= 12 ? "PM" : "AM";
        hours = hours % 12 || 12;

        clock.textContent =
          `${twoDigits(hours)}:${twoDigits(minutes)}:${twoDigits(seconds)} ${period}`;
      } else {
        clock.textContent =
          `${twoDigits(hours)}:${twoDigits(minutes)}:${twoDigits(seconds)}`;
      }

      const options = {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      };

      dateElement.textContent =
        now.toLocaleDateString("fr-FR", options);
    }

    function twoDigits(number) {
      return String(number).padStart(2, "0");
    }

    function applySettings() {
      const selectedTime = timeInput.value;

      if (selectedTime) {
        const [hours, minutes] = selectedTime.split(":");

        customTime = {
          hours: Number(hours),
          minutes: Number(minutes),
          seconds: 0
        };

        useCustomTime = true;
      }

      clock.style.color = colorInput.value;
    }

    function resetClock() {
      useCustomTime = false;
      customTime = null;
      timeInput.value = "";
      clock.style.color = "#ffffff";
      colorInput.value = "#ffffff";
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
