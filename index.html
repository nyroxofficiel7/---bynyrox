<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enregistreur d'écran - BY NYROX</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #050505, #151515);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 700px;
    background: #111;
    border: 1px solid #333;
    border-radius: 22px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 0 35px rgba(0,0,0,0.6);
}

h1 {
    margin: 0 0 10px;
    font-size: 32px;
}

.by {
    color: #ff2222;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 25px;
}

.timer {
    font-size: 48px;
    font-weight: bold;
    margin: 20px 0;
    letter-spacing: 3px;
}

button {
    width: 100%;
    max-width: 400px;
    padding: 16px;
    margin: 8px auto;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #e50914;
    color: white;
}

.stop {
    background: #333;
    color: white;
}

.stop:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.download {
    background: #1683ff;
    color: white;
    display: none;
}

.status {
    margin: 18px 0;
    padding: 13px;
    border-radius: 12px;
    background: #1d1d1d;
    color: #ddd;
    font-size: 15px;
}

.info {
    color: #999;
    font-size: 14px;
    line-height: 1.5;
}

.preview {
    width: 100%;
    margin-top: 20px;
    border-radius: 15px;
    background: black;
    display: none;
}

.logo-nyrox {
    display: block;
    width: 100%;
    max-width: 320px;
    height: auto;
    margin: 30px auto 5px;
    border-radius: 12px;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
        align-items: flex-start;
    }

    .app {
        margin-top: 10px;
        padding: 20px 15px;
    }

    h1 {
        font-size: 26px;
    }

    .timer {
        font-size: 40px;
    }

    button {
        font-size: 16px;
        padding: 15px;
    }

    .logo-nyrox {
        max-width: 260px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>🎥 Enregistreur d'écran</h1>

    <div class="by">BY NYROX</div>

    <div class="timer" id="timer">00:00</div>

    <button class="start" id="startBtn">
        🔴 Démarrer l'enregistrement
    </button>

    <button class="stop" id="stopBtn" disabled>
        ⏹️ Arrêter
    </button>

    <button class="download" id="downloadBtn">
        📥 Télécharger la vidéo
    </button>

    <div class="status" id="status">
        Prêt à enregistrer.
    </div>

    <video
        class="preview"
        id="preview"
        controls
        playsinline>
    </video>

    <div class="info">
        📱 Compatible téléphone lorsque le navigateur autorise
        la capture d'écran.
        <br>
        Choisis ton écran après avoir appuyé sur Démarrer.
    </div>

    <img
        src="by-nyrox.png"
        alt="BY NYROX"
        class="logo-nyrox">

</div>

<script>

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const downloadBtn = document.getElementById("downloadBtn");
const status = document.getElementById("status");
const timer = document.getElementById("timer");
const preview = document.getElementById("preview");

let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];

let timerInterval = null;
let timerStartTime = 0;

let recordedBlob = null;


/* =========================
   MINUTEUR
========================= */

function startTimer() {

    timerStartTime = Date.now();

    timer.textContent = "00:00";

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {

        const elapsed = Math.floor(
            (Date.now() - timerStartTime) / 1000
        );

        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;

        timer.textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

    }, 250);
}


function stopTimer() {

    clearInterval(timerInterval);
    timerInterval = null;
}


/* =========================
   FORMAT VIDÉO
========================= */

function getSupportedMimeType() {

    const types = [
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm",
        "video/mp4"
    ];

    for (const type of types) {

        if (
            typeof MediaRecorder !== "undefined" &&
            MediaRecorder.isTypeSupported(type)
        ) {
            return type;
        }
    }

    return "";
}


/* =========================
   DÉMARRER
========================= */

startBtn.addEventListener("click", async () => {

    recordedChunks = [];
    recordedBlob = null;

    downloadBtn.style.display = "none";
    preview.style.display = "none";

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ) {

        status.textContent =
            "❌ La capture d'écran n'est pas prise en charge par ce navigateur.";

        return;
    }

    if (typeof MediaRecorder === "undefined") {

        status.textContent =
            "❌ Ton navigateur ne permet pas l'enregistrement vidéo.";

        return;
    }

    try {

        status.textContent =
            "📱 Choisis maintenant l'écran à partager...";


        mediaStream =
            await navigator.mediaDevices.getDisplayMedia({

                video: true,

                /* Audio désactivé pour une meilleure
                   compatibilité avec les téléphones */

                audio: false
            });


        const mimeType = getSupportedMimeType();

        if (!mimeType) {

            status.textContent =
                "❌ Aucun format vidéo compatible.";

            mediaStream
                .getTracks()
                .forEach(track => track.stop());

            return;
        }


        mediaRecorder = new MediaRecorder(
            mediaStream,
            {
                mimeType: mimeType
            }
        );


        mediaRecorder.ondataavailable = (event) => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                recordedChunks.push(event.data);
            }
        };


        mediaRecorder.onstop = () => {

            stopTimer();

            if (recordedChunks.length === 0) {

                status.textContent =
                    "❌ Aucun enregistrement n'a été créé.";

                return;
            }


            recordedBlob = new Blob(
                recordedChunks,
                {
                    type: mimeType
                }
            );


            const videoURL =
                URL.createObjectURL(recordedBlob);

            preview.src = videoURL;
            preview.style.display = "block";

            downloadBtn.style.display = "block";

            status.textContent =
                "✅ Enregistrement terminé !";
        };


        /* Si l'utilisateur arrête le partage */

        const videoTrack =
            mediaStream.getVideoTracks()[0];


        if (videoTrack) {

            videoTrack.addEventListener(
                "ended",
                () => {

                    if (
                        mediaRecorder &&
                        mediaRecorder.state !== "inactive"
                    ) {
                        mediaRecorder.stop();
                    }

                    stopTimer();

                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            );
        }


        /* =========================
           DÉMARRAGE DE L'ENREGISTREMENT
        ========================= */

        mediaRecorder.start(1000);

        /* LE MINUTEUR COMMENCE ICI */

        startTimer();

        startBtn.disabled = true;
        stopBtn.disabled = false;

        status.textContent =
            "🔴 Enregistrement en cours...";

    }

    catch (error) {

        console.error(error);

        stopTimer();

        startBtn.disabled = false;
        stopBtn.disabled = true;


        if (error.name === "NotAllowedError") {

            status.textContent =
                "❌ Capture annulée. Autorise le partage d'écran.";

        } else if (error.name === "NotFoundError") {

            status.textContent =
                "❌ Aucun écran disponible.";

        } else if (error.name === "NotReadableError") {

            status.textContent =
                "❌ L'écran ne peut pas être capturé.";

        } else {

            status.textContent =
                "❌ Enregistrement impossible sur cet appareil.";
        }
    }

});


/* =========================
   ARRÊTER
========================= */

stopBtn.addEventListener("click", () => {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {
        mediaRecorder.stop();
    }


    if (mediaStream) {

        mediaStream
            .getTracks()
            .forEach(track => track.stop());

        mediaStream = null;
    }


    stopTimer();

    startBtn.disabled = false;
    stopBtn.disabled = true;
});


/* =========================
   TÉLÉCHARGER
========================= */

    if (!recordedBlob) {
        return;
    }


    const url =
        URL.createObjectURL(recordedBlob);


    const extension =
        recordedBlob.type.includes
