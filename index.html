<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enregistreur d'écran - BY NYROX</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #050505, #151515);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 700px;
    background: #111;
    border: 1px solid #333;
    border-radius: 22px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 0 35px rgba(0,0,0,0.6);
}

h1 {
    margin: 0 0 10px;
    font-size: 32px;
}

.by {
    color: #ff2222;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 25px;
}

.timer {
    font-size: 48px;
    font-weight: bold;
    margin: 20px 0;
    letter-spacing: 3px;
}

button {
    width: 100%;
    max-width: 400px;
    padding: 16px;
    margin: 8px auto;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:active {
    transform: scale(0.97);
}

.start {
    background: #e50914;
    color: white;
}

.stop {
    background: #333;
    color: white;
}

.stop:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.download {
    background: #1683ff;
    color: white;
    display: none;
}

.status {
    margin: 18px 0;
    padding: 13px;
    border-radius: 12px;
    background: #1d1d1d;
    color: #ddd;
    font-size: 15px;
    line-height: 1.5;
}

.info {
    color: #999;
    font-size: 14px;
    line-height: 1.5;
    margin-top: 15px;
}

.preview {
    width: 100%;
    margin-top: 20px;
    border-radius: 15px;
    background: black;
    display: none;
}

.logo-nyrox {
    display: block;
    width: 100%;
    max-width: 320px;
    height: auto;
    margin: 30px auto 5px;
    border-radius: 12px;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
        align-items: flex-start;
    }

    .app {
        margin-top: 10px;
        padding: 20px 15px;
        border-radius: 18px;
    }

    h1 {
        font-size: 26px;
    }

    .timer {
        font-size: 40px;
    }

    button {
        font-size: 16px;
        padding: 15px;
    }

    .logo-nyrox {
        max-width: 260px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>🎥 Enregistreur d'écran</h1>

    <div class="by">
        BY NYROX
    </div>

    <div class="timer" id="timer">
        00:00
    </div>

    <button class="start" id="startBtn">
        🔴 Démarrer l'enregistrement
    </button>

    <button class="stop" id="stopBtn" disabled>
        ⏹️ Arrêter
    </button>

    <button class="download" id="downloadBtn">
        📥 Télécharger la vidéo
    </button>

    <div class="status" id="status">
        Prêt à enregistrer.
    </div>

    <video
        class="preview"
        id="preview"
        controls
        playsinline
    ></video>

    <div class="info">
        📱 Sur téléphone, la capture d'écran dépend du navigateur et du système.
        <br>
        Appuie sur « Démarrer », puis choisis l'écran à partager.
    </div>
