<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;

    .app {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;

    h1 {
      font-size: 34px;

    h2 {

    .timer {

    button {
      border: none;

    #start {

    #stop {

    }

    #stop:disabled {
      opacity: 0.4;

    }

    #status {
      margin-top: 25px;
      font-size: 18px;

      display: none;
      width: 100%;

      border-radius: 12px;
